on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: google-github-actions/auth@v3
        with:
          project_id: kit-tasks
          credentials_json: ${{ secrets.FIREBASE_DEPLOYER_CREDENTIALS_JSON }}
      - run: npx firebase deploy --non-interactive
